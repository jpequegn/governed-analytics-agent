name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run fixtures
      - run: git diff --exit-code -- fixtures/
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node dist/src/cli.js demo /tmp/governed-demo
      - run: node dist/src/cli.js verify /tmp/governed-demo/receipt.json /tmp/governed-demo/snapshot
      - run: npm run evaluate -- /tmp/governed-evaluation
      - run: python3 scripts/analyze_evals.py /tmp/governed-evaluation/evaluation.json
